server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static IP, not the "backend" service name: see compose.yaml networks
    # comment for why DNS between containers isn't available here.
    location /api/ {
        proxy_pass http://10.89.10.3:8080/api/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://10.89.10.3:8080/health;
        proxy_set_header Host $host;
    }
}
