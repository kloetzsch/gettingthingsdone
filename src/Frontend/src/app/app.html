<mat-toolbar color="primary" class="app-toolbar">
  <span class="app-title">Konrads Aufgaben: getting things done</span>
</mat-toolbar>

<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened position="start" class="nav-sidenav" [fixedInViewport]="false">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="is-active">Aufgaben</a>
      <a mat-list-item routerLink="/projects" routerLinkActive="is-active">Projekte</a>
      <a mat-list-item routerLink="/categories" routerLinkActive="is-active">Kategorien</a>
      <a mat-list-item routerLink="/statistics" routerLinkActive="is-active">Statistik</a>
    </mat-nav-list>

    <mat-divider />

    <div class="nav-stats">
      <app-completed-today />
      <app-daily-minutes-chart />
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="center-content">
    <div class="center-stack">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
